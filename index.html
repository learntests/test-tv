<script>
const C={"All":null,"USA":"us","Canada":"ca","Iran":"ir"},BASE="https://iptv-org.github.io/iptv/countries/";

 let j=i+1;while(j<L.length&&(L[j].startsWith("#")||!L[j].trim()))j++;
 out.push({name:L[i].split(",").pop().trim(),logo:(L[i].match(/tvg-logo="([^"]*)"/)||[])[1]||"",
 cat:((L[i].match(/group-title="([^"]*)"/)||[])[1]||"Other").split(";")[0]||"Other",url:(L[j]||"").trim(),country:cn});}}return out;}
async function load(){all=[];for(const [n,code] of Object.entries(C)){if(!code)continue;

 const list=all.filter(c=>country=="All"||c.country==country),cats=["All",...new Set(list.map(c=>c.cat))].sort((a,b)=>a=="All"?-1:b=="All"?1:a.localeCompare(b));

 else fail();}
